name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Includes the security-and-quality suite, which catches the taint
          # flows this app cares about most: request data reaching a query,
          # a redirect, or a file path.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
