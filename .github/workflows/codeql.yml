name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    # Pinned for the same reason as ci.yml: ubuntu-latest moves to 26 in Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # Includes the security-and-quality suite, which catches the taint
          # flows this app cares about most: request data reaching a query,
          # a redirect, or a file path.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
