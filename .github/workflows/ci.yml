name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed advisory in a pinned dependency shows up
    # even when nobody has pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # Build- and test-time placeholders. Real values live in Vercel and are never
  # needed to compile — if a build ever required a real secret, that would
  # itself be the bug.
  DISCOGS_CONSUMER_KEY: ci-placeholder-key
  DISCOGS_CONSUMER_SECRET: ci-placeholder-secret
  SESSION_SECRET: Y2ktb25seS1wbGFjZWhvbGRlci1rZXktMzJieXRlcy0
  APP_ORIGIN: http://localhost:3000
  DISCOGS_CONTACT: +https://example.invalid
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gemtopia_ci

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gemtopia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Environment contract tests
        run: npm run test:env

      - name: Security header tests
        run: npm run test:headers

      - name: Playable de-duplication tests
        run: npm run test:playables

      - name: Crate sorting tests
        run: npm run test:sorting

      - name: Share link tests
        run: npm run test:share

      - name: Tempo estimator tests
        run: npm run test:tempo

      - name: Mixability tests
        run: npm run test:mixing

      - name: Apply schema
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Assert no secret reached the client bundle
        run: |
          if grep -rl "ci-placeholder-secret" .next/static/ 2>/dev/null; then
            echo "::error::A server-only secret was inlined into the client bundle"
            exit 1
          fi
          echo "Client bundle is clean."

      - name: API integration tests
        run: |
          npm run start -- --port 3000 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done
          BASE=http://localhost:3000 npm run test:api
